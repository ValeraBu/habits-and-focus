<div class="habit-card">
  <div
    class="habit-card__icon"
    [style.background]="'var(--' + habit().color + '-soft)'"
    [style.color]="'var(--' + habit().color + '-dark)'"
  >
    @switch (habit().category) {
      @case ('reading') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11a1 1 0 0 1 1 1v15a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 1 4 17.5V5.5Z"/><path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H13a1 1 0 0 0-1 1v15a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 0 1.5-1.5V5.5Z"/></svg>
      }
      @case ('knitting') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="6"/><path d="M8 10.5c2 1 6 1 8 0M7.5 13.5c2.5 1.5 6.5 1.5 9 0M8.5 16.5c1.5 .8 5.5 .8 7 0"/><path d="M9 8 6 3M15 8l3-5"/></svg>
      }
      @case ('study') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-4 10 4-10 4-10-4Z"/><path d="M6 10.5v4.5c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"/><path d="M22 8v6"/></svg>
      }
      @case ('custom') {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>
      }
    }
  </div>

  <div class="habit-card__body">
    <div class="habit-card__name">{{ habit().name }}</div>
    <div class="habit-card__progress">
      <div class="progress-track">
        <div
          class="progress-fill"
          [style.width.%]="progressPercent()"
          [style.background]="'var(--' + habit().color + ')'"
        ></div>
      </div>
      <div class="habit-card__meta">
        @if (isEditingProgress()) {
          <input
            #progressInput
            type="number"
            class="progress-input"
            [value]="progressDraft()"
            (input)="onProgressInput(progressInput.value)"
            (keydown.enter)="confirmProgressEdit()"
            (keydown.escape)="cancelProgressEdit()"
            (blur)="confirmProgressEdit()"
            min="0"
            max="1000"
          />
          / {{ habit().targetPerDay }} {{ habit().unit }}
        } @else {
          <button
            type="button"
            class="progress-value"
            (click)="startEditingProgress()"
            aria-label="Изменить прогресс"
          >
            {{ habit().todayValue }} / {{ habit().targetPerDay }} {{ habit().unit }}
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        }
      </div>
    </div>
  </div>

  <div class="habit-card__actions">
    <button
      type="button"
      class="checkbox"
      [class.checkbox--checked]="habit().completedToday"
      [style.borderColor]="'var(--' + habit().color + ')'"
      [style.background]="habit().completedToday ? 'var(--' + habit().color + ')' : 'transparent'"
      (click)="toggled.emit()"
      [attr.aria-pressed]="habit().completedToday"
      aria-label="Отметить выполнение"
    >
      @if (habit().completedToday) {
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg>
      }
    </button>

    <button type="button" class="icon-button" (click)="editRequested.emit()" aria-label="Редактировать">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button type="button" class="icon-button" (click)="archiveRequested.emit()" aria-label="Архивировать">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 18V9"/><path d="M10 13.5h4"/></svg>
    </button>
  </div>
</div>

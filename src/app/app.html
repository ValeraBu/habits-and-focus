<div class="shell">
  <nav class="nav">
    <div class="nav__brand">
      <span class="nav__logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </span>
      <span class="nav__brand-text">Habit &amp; Focus<br />Hub</span>
    </div>

    <a class="nav__link" routerLink="/habits" routerLinkActive="nav__link--active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 6 1.4 1.4L7.3 5"/><path d="M10 6h10.5"/><path d="m3.5 12 1.4 1.4 2.4-2.4"/><path d="M10 12h10.5"/><path d="m3.5 18 1.4 1.4 2.4-2.4"/><path d="M10 18h10.5"/></svg>
      <span class="nav__link-text">Привычки</span>
    </a>
    <a class="nav__link" routerLink="/focus" routerLinkActive="nav__link--active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
      <span class="nav__link-text">Фокус</span>
    </a>
    <a class="nav__link" routerLink="/dashboard" routerLinkActive="nav__link--active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>
      <span class="nav__link-text">Статистика</span>
    </a>

    <app-reminder-settings />

    <button type="button" class="nav__theme-toggle" (click)="toggleTheme()" aria-label="Переключить тему">
      @if (isDark()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M3 12h2M19 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      }
      <span class="nav__link-text">Тема</span>
    </button>
  </nav>

  <button type="button" class="mobile-theme-toggle" (click)="toggleTheme()" aria-label="Переключить тему">
    @if (isDark()) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M3 12h2M19 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    }
  </button>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="tabbar">
    <a class="tabbar__link" routerLink="/habits" routerLinkActive="tabbar__link--active" aria-label="Привычки">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 6 1.4 1.4L7.3 5"/><path d="M10 6h10.5"/><path d="m3.5 12 1.4 1.4 2.4-2.4"/><path d="M10 12h10.5"/><path d="m3.5 18 1.4 1.4 2.4-2.4"/><path d="M10 18h10.5"/></svg>
    </a>
    <a class="tabbar__link" routerLink="/focus" routerLinkActive="tabbar__link--active" aria-label="Фокус">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
    </a>
    <a class="tabbar__link" routerLink="/dashboard" routerLinkActive="tabbar__link--active" aria-label="Статистика">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>
    </a>
  </nav>
</div>

<div class="dropdown">
  <button
    type="button"
    class="dropdown__trigger"
    [class.dropdown__trigger--open]="isOpen()"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
  >
    <ng-content select="[leading]" />
    <span class="dropdown__label">{{ selectedLabel() }}</span>
    <svg
      class="dropdown__chevron"
      [class.dropdown__chevron--open]="isOpen()"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    ><path d="m6 9 6 6 6-6"/></svg>
  </button>

  @if (isOpen()) {
    <div class="dropdown__panel" [class.dropdown__panel--up]="opensUpward()" role="listbox">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="dropdown__option"
          [class.dropdown__option--selected]="option.value === value()"
          [attr.aria-selected]="option.value === value()"
          (click)="select(option.value)"
        >
          {{ option.label }}
          @if (option.value === value()) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4 4L19 7.5"/></svg>
          }
        </button>
      }
    </div>
  }
</div>

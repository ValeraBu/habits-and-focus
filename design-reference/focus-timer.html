<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Focus Timer — Habit and Focus Hub</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: oklch(96% 0.016 75);
    --bg-panel: oklch(93% 0.02 75);
    --card: oklch(99% 0.008 80);
    --text: oklch(30% 0.025 50);
    --text-soft: oklch(52% 0.02 50);
    --text-faint: oklch(68% 0.015 60);
    --border: oklch(89% 0.015 70);
    --coral: oklch(68% 0.14 35);
    --coral-dark: oklch(56% 0.15 32);
    --coral-soft: oklch(93% 0.04 35);
    --sage-soft: oklch(92% 0.03 150);
    --sage-dark: oklch(46% 0.07 150);
    --shadow: 0 20px 45px -18px oklch(30% 0.06 40 / 0.35);
    --shadow-sm: 0 3px 10px -4px oklch(35% 0.05 40 / 0.28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
  a { color: var(--coral-dark); }
  a:hover { color: var(--coral); }
</style>

</head>
<body style="margin:0;background:#f2ece0;display:flex;justify-content:center;padding:24px;">

<div style="width:1440px;height:900px;background:var(--bg);display:flex;color:var(--text);overflow:hidden;">

  <div style="width:232px;flex-shrink:0;background:var(--bg-panel);padding:32px 18px;display:flex;flex-direction:column;gap:34px;border-right:1px solid var(--border);">
    <div style="display:flex;align-items:center;gap:10px;padding:0 10px;">
      <div style="width:36px;height:36px;border-radius:11px;background:var(--coral);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </div>
      <div style="font-weight:800;font-size:15px;line-height:1.2;">Habit &amp; Focus<br>Hub</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--text-soft);font-weight:600;font-size:14.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 6 1.4 1.4L7.3 5"/><path d="M10 6h10.5"/><path d="m3.5 12 1.4 1.4 2.4-2.4"/><path d="M10 12h10.5"/><path d="m3.5 18 1.4 1.4 2.4-2.4"/><path d="M10 18h10.5"/></svg>
        Привычки
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--coral-soft);color:var(--coral-dark);font-weight:700;font-size:14.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
        Фокус
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--text-soft);font-weight:600;font-size:14.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>
        Статистика
      </div>
    </div>
  </div>

  <div style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;">

    <!-- Visual notification: session-complete toast -->
    <div style="position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:15px 20px;border:1.5px solid var(--sage-soft);">
      <div style="width:38px;height:38px;border-radius:999px;background:var(--sage-soft);display:flex;align-items:center;justify-content:center;color:var(--sage-dark);flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 5 5L20 7"/></svg>
      </div>
      <div>
        <div style="font-weight:800;font-size:14.5px;">Сессия завершена!</div>
        <div style="font-size:12.5px;color:var(--text-soft);font-weight:600;margin-top:2px;">45 минут в фокусе — отличная работа</div>
      </div>
      <div style="width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);margin-left:4px;flex-shrink:0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </div>
    </div>

    <div style="display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow-sm);">
      <div style="padding:10px 22px;border-radius:999px;background:var(--coral);color:white;font-weight:700;font-size:14px;">Фокус</div>
      <div style="padding:10px 22px;border-radius:999px;color:var(--text-soft);font-weight:600;font-size:14px;">Перерыв</div>
    </div>

    <!-- Duration picker -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:9px;">
      <div style="font-size:11.5px;color:var(--text-faint);font-weight:700;letter-spacing:0.3px;text-transform:uppercase;">Длительность</div>
      <div style="display:flex;gap:8px;">
        <div style="padding:8px 16px;border-radius:999px;color:var(--text-soft);font-weight:700;font-size:13.5px;border:1.5px solid var(--border);background:var(--card);">15 мин</div>
        <div style="padding:8px 16px;border-radius:999px;color:var(--text-soft);font-weight:700;font-size:13.5px;border:1.5px solid var(--border);background:var(--card);">25 мин</div>
        <div style="padding:8px 16px;border-radius:999px;color:white;font-weight:700;font-size:13.5px;background:var(--coral);box-shadow:var(--shadow-sm);">45 мин</div>
        <div style="padding:8px 16px;border-radius:999px;color:var(--text-soft);font-weight:700;font-size:13.5px;border:1.5px solid var(--border);background:var(--card);">60 мин</div>
      </div>
    </div>

    <div style="position:relative;width:280px;height:280px;display:flex;align-items:center;justify-content:center;">
      <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute;top:0;left:0;transform:rotate(-90deg);">
        <circle cx="140" cy="140" r="122" fill="none" stroke="var(--border)" stroke-width="16"/>
        <circle cx="140" cy="140" r="122" fill="none" stroke="var(--coral)" stroke-width="16" stroke-linecap="round" stroke-dasharray="766.5" stroke-dashoffset="536"/>
      </svg>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="font-size:50px;font-weight:800;letter-spacing:-1px;">17:30</div>
        <div style="font-size:13.5px;color:var(--text-soft);font-weight:600;">до конца сессии</div>
      </div>
    </div>

    <!-- Start / Reset controls -->
    <div style="display:flex;align-items:center;gap:14px;">
      <button style="display:flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);font-family:inherit;font-weight:700;font-size:14.5px;color:var(--text-soft);cursor:pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        Сброс
      </button>
      <button style="display:flex;align-items:center;gap:9px;padding:16px 38px;border-radius:999px;border:none;background:var(--coral);font-family:inherit;font-weight:800;font-size:15.5px;color:white;cursor:pointer;box-shadow:var(--shadow);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M7 5.5v13l11-6.5-11-6.5Z"/></svg>
        Старт
      </button>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="font-size:13px;color:var(--text-soft);font-weight:700;">Сессий сегодня</div>
      <div style="display:flex;gap:8px;">
        <div style="width:10px;height:10px;border-radius:999px;background:var(--coral);"></div>
        <div style="width:10px;height:10px;border-radius:999px;background:var(--coral);"></div>
        <div style="width:10px;height:10px;border-radius:999px;background:var(--coral);"></div>
        <div style="width:10px;height:10px;border-radius:999px;border:1.5px solid var(--border);"></div>
        <div style="width:10px;height:10px;border-radius:999px;border:1.5px solid var(--border);"></div>
      </div>
    </div>

    <!-- Habit link — styled open dropdown -->
    <div style="position:relative;">
      <div style="display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow-sm);border-radius:999px;padding:10px 18px;border:1.5px solid var(--coral);">
        <div style="width:26px;height:26px;border-radius:9px;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;color:var(--coral-dark);flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11a1 1 0 0 1 1 1v15a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 1 4 17.5V5.5Z"/><path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H13a1 1 0 0 0-1 1v15a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 0 1.5-1.5V5.5Z"/></svg>
        </div>
        <div style="font-size:13.5px;font-weight:700;color:var(--text);">Прочитать 15 страниц</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </div>

      <div style="position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:7px;display:flex;flex-direction:column;gap:2px;z-index:2;">
        <div style="padding:10px 13px;border-radius:11px;color:var(--text-soft);font-weight:600;font-size:13.5px;">Без привычки</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:11px;background:var(--coral-soft);color:var(--coral-dark);font-weight:700;font-size:13.5px;">
          Прочитать 15 страниц
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4 4L19 7.5"/></svg>
        </div>
        <div style="padding:10px 13px;border-radius:11px;color:var(--text-soft);font-weight:600;font-size:13.5px;">Тренировка</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>

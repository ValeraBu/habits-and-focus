<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Habit Form — Habit and Focus Hub</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: oklch(96% 0.016 75);
    --bg-panel: oklch(93% 0.02 75);
    --card: oklch(99% 0.008 80);
    --text: oklch(30% 0.025 50);
    --text-soft: oklch(52% 0.02 50);
    --text-faint: oklch(68% 0.015 60);
    --border: oklch(89% 0.015 70);
    --coral: oklch(68% 0.14 35);
    --coral-dark: oklch(56% 0.15 32);
    --coral-soft: oklch(93% 0.04 35);
    --sage: oklch(64% 0.07 150);
    --sage-dark: oklch(46% 0.07 150);
    --sage-soft: oklch(92% 0.03 150);
    --yellow: oklch(80% 0.13 85);
    --shadow: 0 20px 45px -18px oklch(30% 0.06 40 / 0.45);
    --shadow-sm: 0 3px 10px -4px oklch(35% 0.05 40 / 0.28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; }
  a { color: var(--coral-dark); }
  a:hover { color: var(--coral); }
  ::placeholder { color: var(--text-faint); }
</style>

</head>
<body style="margin:0;background:#f2ece0;display:flex;justify-content:center;padding:24px;">

<div style="width:1440px;height:900px;background:var(--bg);display:flex;color:var(--text);overflow:hidden;position:relative;">

  <div style="width:232px;flex-shrink:0;background:var(--bg-panel);padding:32px 18px;display:flex;flex-direction:column;gap:34px;border-right:1px solid var(--border);">
    <div style="display:flex;align-items:center;gap:10px;padding:0 10px;">
      <div style="width:36px;height:36px;border-radius:11px;background:var(--coral);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </div>
      <div style="font-weight:800;font-size:15px;line-height:1.2;">Habit &amp; Focus<br>Hub</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--coral-soft);color:var(--coral-dark);font-weight:700;font-size:14.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 6 1.4 1.4L7.3 5"/><path d="M10 6h10.5"/><path d="m3.5 12 1.4 1.4 2.4-2.4"/><path d="M10 12h10.5"/><path d="m3.5 18 1.4 1.4 2.4-2.4"/><path d="M10 18h10.5"/></svg>
        Привычки
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--text-soft);font-weight:600;font-size:14.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
        Фокус
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--text-soft);font-weight:600;font-size:14.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/><path d="M2 20h20"/></svg>
        Статистика
      </div>
    </div>
  </div>

  <div style="flex:1;padding:44px 56px;opacity:0.5;filter:blur(1px);">
    <div style="font-size:26px;font-weight:800;">Доброе утро</div>
    <div style="font-size:14.5px;color:var(--text-soft);margin-top:4px;">Четверг, 4 сентября</div>
    <div style="margin-top:26px;background:var(--card);border-radius:18px;padding:16px 22px;box-shadow:var(--shadow-sm);height:64px;"></div>
    <div style="margin-top:12px;background:var(--card);border-radius:18px;padding:16px 22px;box-shadow:var(--shadow-sm);height:64px;"></div>
  </div>

  <!-- Scrim -->
  <div style="position:absolute;inset:0;background:oklch(28% 0.03 50 / 0.4);"></div>

  <!-- Modal -->
  <div style="position:absolute;top:50%;left:calc(50% + 116px);transform:translate(-50%,-50%);width:540px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:32px 36px;display:flex;flex-direction:column;gap:22px;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:19px;font-weight:800;">Новая привычка</div>
      <div style="width:32px;height:32px;border-radius:999px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-soft);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);">Название</div>
      <div style="border:1.5px solid var(--border);border-radius:14px;padding:13px 16px;font-size:14.5px;color:var(--text);background:var(--bg);">Прочитать 15 страниц</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);">Категория</div>
      <div style="display:flex;gap:8px;">
        <div style="display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:var(--coral-soft);color:var(--coral-dark);font-weight:700;font-size:13.5px;border:1.5px solid var(--coral);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H11a1 1 0 0 1 1 1v15a1 1 0 0 0-1-1H5.5A1.5 1.5 0 0 1 4 17.5V5.5Z"/><path d="M20 5.5c0-.83-.67-1.5-1.5-1.5H13a1 1 0 0 0-1 1v15a1 1 0 0 1 1-1h5.5a1.5 1.5 0 0 0 1.5-1.5V5.5Z"/></svg>
          Чтение
        </div>
        <div style="display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;color:var(--text-soft);font-weight:600;font-size:13.5px;border:1.5px solid var(--border);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="6"/><path d="M8 10.5c2 1 6 1 8 0M7.5 13.5c2.5 1.5 6.5 1.5 9 0"/><path d="M9 8 6 3M15 8l3-5"/></svg>
          Вязание
        </div>
        <div style="display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;color:var(--text-soft);font-weight:600;font-size:13.5px;border:1.5px solid var(--border);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-4 10 4-10 4-10-4Z"/><path d="M6 10.5v4.5c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"/></svg>
          Учёба
        </div>
        <div style="display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;color:var(--text-soft);font-weight:600;font-size:13.5px;border:1.5px solid var(--border);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>
          Своё
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;font-weight:700;color:var(--text-soft);">Цвет</div>
      <div style="display:flex;gap:10px;">
        <div style="width:30px;height:30px;border-radius:999px;background:var(--coral);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--coral);"></div>
        <div style="width:30px;height:30px;border-radius:999px;background:var(--sage);"></div>
        <div style="width:30px;height:30px;border-radius:999px;background:var(--yellow);"></div>
        <div style="width:30px;height:30px;border-radius:999px;background:oklch(66% 0.09 280);"></div>
        <div style="width:30px;height:30px;border-radius:999px;background:oklch(70% 0.1 200);"></div>
      </div>
    </div>

    <div style="display:flex;gap:16px;">
      <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:13px;font-weight:700;color:var(--text-soft);">Цель в день</div>
        <div style="border:1.5px solid var(--border);border-radius:14px;padding:13px 16px;font-size:14.5px;color:var(--text);background:var(--bg);">15</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:13px;font-weight:700;color:var(--text-soft);">Единица</div>
        <div style="border:1.5px solid var(--border);border-radius:14px;padding:13px 16px;font-size:14.5px;color:var(--text);background:var(--bg);display:flex;align-items:center;justify-content:space-between;">
          страниц
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-top:6px;">
      <button style="flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--border);background:transparent;font-family:inherit;font-weight:700;font-size:14.5px;color:var(--text-soft);cursor:pointer;">Отмена</button>
      <button style="flex:1;padding:13px;border-radius:14px;border:none;background:var(--coral);font-family:inherit;font-weight:700;font-size:14.5px;color:white;cursor:pointer;box-shadow:var(--shadow-sm);">Сохранить</button>
    </div>

  </div>
</div>
</body>
</html>
